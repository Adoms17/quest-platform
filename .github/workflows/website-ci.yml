name: Website CI

on:
  pull_request:
    branches: [main, staging, codex/full-mvp-production-preparation-20261020]
    paths: ['website/**', '.github/workflows/website-ci.yml']
  push:
    branches: [main, staging]
    paths: ['website/**', '.github/workflows/website-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [production, staging]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref == 'codex/full-mvp-production-preparation-20261020' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Build production
        if: matrix.environment == 'production'
        run: npm run build
      - name: Build stage
        if: matrix.environment == 'staging'
        run: npm run build:stage
      - run: node --test tests/tariff-catalog.test.mjs
      - run: npm run test:sites
      - run: npm run test:build -- ${{ matrix.environment }}

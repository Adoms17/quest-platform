  subscription-settlement-schedule:
    if: github.ref == 'refs/heads/staging' && startsWith(inputs.operation, 'subscription-settlement-schedule-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: stage-subscription-settlement-schedule
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
      SANDBOX_ORDER_ID: ${{ inputs.sandbox_order_id }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test -- scripts/subscription-settlement-schedule.test.js scripts/check-subscription-settlement-release.test.js
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Require complete schema except emergency disable
        if: inputs.operation != 'subscription-settlement-schedule-disable'
        run: |
          npx supabase migration list --linked --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/receipt-migrations.json"
          node scripts/check-subscription-settlement-release.mjs "$RUNNER_TEMP/receipt-migrations.json" --require-applied
      - name: Prepare validated operation
        run: node scripts/subscription-settlement-schedule.mjs "${OPERATION#subscription-settlement-schedule-}" "$RUNNER_TEMP/settlement-schedule.sql"
      - name: Close runtime before mutations
        if: inputs.operation != 'subscription-settlement-schedule-preview'
        run: npx supabase secrets set YOOKASSA_SANDBOX_SETTLEMENT_ORDER_ENABLED=false --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify target before enabling runtime
        if: inputs.operation == 'subscription-settlement-schedule-enable'
        run: |
          node scripts/subscription-settlement-schedule.mjs preview "$RUNNER_TEMP/settlement-preview.sql"
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_ID" --file "$RUNNER_TEMP/settlement-preview.sql"
          npx supabase secrets set "YOOKASSA_SANDBOX_SETTLEMENT_ORDER_ID=$SANDBOX_ORDER_ID" YOOKASSA_SANDBOX_SETTLEMENT_ORDER_ENABLED=true --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply atomic schedule operation
        run: npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_ID" --file "$RUNNER_TEMP/settlement-schedule.sql"
      - name: Close runtime after unsuccessful mutation
        if: (failure() || cancelled()) && inputs.operation != 'subscription-settlement-schedule-preview'
        run: npx supabase secrets set YOOKASSA_SANDBOX_SETTLEMENT_ORDER_ENABLED=false --project-ref "$SUPABASE_PROJECT_ID"
      - name: Close schedule after unsuccessful mutation
        if: (failure() || cancelled()) && inputs.operation != 'subscription-settlement-schedule-preview'
        run: npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_ID" --file scripts/disable-stage-subscription-settlement.sql

  subscription-settlement-fixture:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'subscription-settlement-fixture-preview' || inputs.operation == 'subscription-settlement-fixture-provision')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate stage target
        run: test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Require complete acceptance schema
        run: |
          npx supabase migration list --linked --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/receipt-migrations.json"
          node scripts/check-subscription-settlement-release.mjs "$RUNNER_TEMP/receipt-migrations.json" --require-applied
      - name: Disable preparation before provisioning
        if: inputs.operation == 'subscription-settlement-fixture-provision'
        run: npx supabase secrets set YOOKASSA_SANDBOX_SETTLEMENT_ORDER_ENABLED=false ADMIN_FISCAL_ACCEPTANCE_PREPARE_ENABLED=false YOOKASSA_SANDBOX_FISCAL_ACCEPTANCE_ENABLED=false YOOKASSA_SANDBOX_FISCAL_ACCEPTANCE_DISPATCH=false --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview fixture with rollback
        if: inputs.operation == 'subscription-settlement-fixture-preview'
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("scripts/stage-subscription-settlement-fixture.sql","utf8"); if(!/commit;\s*$/.test(s))throw Error("Missing transaction end"); fs.writeFileSync(process.env.RUNNER_TEMP+"/fiscal-fixture-preview.sql",s.replace(/commit;\s*$/,"rollback;\n"));'
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_ID" --file "$RUNNER_TEMP/fiscal-fixture-preview.sql"
      - name: Provision fixture without preparing payment
        if: inputs.operation == 'subscription-settlement-fixture-provision'
        run: npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_ID" --file scripts/stage-subscription-settlement-fixture.sql

  subscription-settlement-recover-existing:
    if: github.ref == 'refs/heads/staging' && inputs.operation == 'subscription-settlement-recover-existing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: stage-subscription-settlement-schedule
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test -- scripts/recover-stage-settlement.test.js
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Require corrected schema
        run: |
          npx supabase migration list --linked --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/receipt-migrations.json"
          node scripts/check-subscription-settlement-release.mjs "$RUNNER_TEMP/receipt-migrations.json" --require-applied
      - name: Recover existing receipt using provider GET only
        env:
          YOOKASSA_SANDBOX_SHOP_ID: ${{ secrets.YOOKASSA_SANDBOX_SHOP_ID }}
          YOOKASSA_SANDBOX_SECRET_KEY: ${{ secrets.YOOKASSA_SANDBOX_SECRET_KEY }}
        run: node scripts/recover-stage-settlement.mjs

  reconcile-compatible-functions:
    if: github.ref == 'refs/heads/staging' && inputs.operation == 'reconcile-compatible-functions-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require approved commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test -- supabase/functions/_shared --maxWorkers=1
      - name: Disable sandbox and all reconcile dispatch paths
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --no-install supabase secrets set \
            YOOKASSA_SANDBOX_ENABLED=false \
            YOOKASSA_SANDBOX_SUBSCRIPTION_FISCAL_DISPATCH=false \
            YOOKASSA_SANDBOX_SETTLEMENT_DISPATCH=false \
            YOOKASSA_SANDBOX_SUBSCRIPTION_FISCAL_RECONCILIATION=false \
            YOOKASSA_SANDBOX_SETTLEMENT_RECONCILIATION=false \
            YOOKASSA_SANDBOX_RECEIPT_RECONCILIATION=false \
            --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy only sandbox-reconcile
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase functions deploy sandbox-reconcile --project-ref "$SUPABASE_PROJECT_ID"
      - name: Record completion and remaining acceptance
        run: |
          echo "Released sandbox-reconcile from $GITHUB_SHA with sandbox disabled." >> "$GITHUB_STEP_SUMMARY"
          echo 'No SQL, cron changes, provider requests or automatic re-enable performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Secret update success does not prove old invocations drained. Verify deployed code, disabled runtime and quiescence before SQL guard/pin.' >> "$GITHUB_STEP_SUMMARY"

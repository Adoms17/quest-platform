name: Deploy Supabase staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against quest-platform-staging
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy
          - reconcile
          - reconcile-order
          - admin-dry-run
          - admin-deploy
          - admin-catalog-dry-run
          - admin-catalog-deploy
          - tariff-release-dry-run
          - tariff-release-deploy
          - payments-release-dry-run
          - payments-release-deploy
          - recurring-dry-run
          - recurring-apply
          - recurring-notice-dry-run
          - recurring-notice-apply
          - recurring-scope-dry-run
          - recurring-scope-apply
          - future-discount-dry-run
          - future-discount-apply
          - recurring-consents-dry-run
          - recurring-consents-apply
          - payment-processing-dry-run
          - payment-processing-apply
          - payment-details-dry-run
          - payment-details-apply
          - order-schedule-dry-run
          - order-schedule-apply
          - order-signature-dry-run
          - order-signature-apply
          - organization-quests-dry-run
          - organization-quests-apply
          - order-vault-configure
          - recurring-disabled-smoke
          - recurring-acceptance-run
      sandbox_order_id:
        description: Exact sandbox order UUID for reconcile-order
        type: string
        required: false
      recurring_organization_id:
        description: Explicit sandbox organization UUID for one recurring acceptance run
        type: string
        required: false
      deploy_sandbox:
        description: Publish test billing Edge Functions (staging only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.operation == 'dry-run' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
      QUEST_ACCESS_FINGERPRINT_SECRET: ${{ secrets.QUEST_ACCESS_FINGERPRINT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate staging secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          if [ "${{ inputs.operation }}" = "deploy" ]; then
            test -n "$QUEST_ACCESS_FINGERPRINT_SECRET"
          fi

      - name: Link staging project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify test billing shop before migrations
        if: inputs.operation == 'deploy' && inputs.deploy_sandbox
        env:
          YOOKASSA_SANDBOX_SHOP_ID: ${{ secrets.YOOKASSA_SANDBOX_SHOP_ID }}
          YOOKASSA_SANDBOX_SECRET_KEY: ${{ secrets.YOOKASSA_SANDBOX_SECRET_KEY }}
          YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
        run: |
          node -e "if (!/^[a-f0-9]{64}$/.test(process.env.YOOKASSA_SANDBOX_WORKER_TOKEN ?? '')) process.exit(1)"
          node scripts/verify-sandbox-shop.mjs

      - name: Preview migrations
        if: inputs.operation == 'dry-run'
        run: npx supabase db push --dry-run

      - name: Apply migrations
        if: inputs.operation == 'deploy'
        run: npx supabase db push

      - name: Run database and RLS tests
        if: inputs.operation == 'deploy'
        run: npx supabase test db --linked

      - name: Configure Edge Function secrets
        if: inputs.operation == 'deploy'
        run: npx supabase secrets set QUEST_ACCESS_FINGERPRINT_SECRET="$QUEST_ACCESS_FINGERPRINT_SECRET" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy quest code gateway
        if: inputs.operation == 'deploy'
        run: npx supabase functions deploy redeem-quest-code --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publish disabled sandbox functions
        if: inputs.operation == 'deploy' && inputs.deploy_sandbox
        env:
          YOOKASSA_SANDBOX_SHOP_ID: ${{ secrets.YOOKASSA_SANDBOX_SHOP_ID }}
          YOOKASSA_SANDBOX_SECRET_KEY: ${{ secrets.YOOKASSA_SANDBOX_SECRET_KEY }}
          YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
        run: |
          npx supabase secrets set YOOKASSA_SANDBOX_ENABLED=false YOOKASSA_SANDBOX_SHOP_ID="$YOOKASSA_SANDBOX_SHOP_ID" YOOKASSA_SANDBOX_SECRET_KEY="$YOOKASSA_SANDBOX_SECRET_KEY" --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase secrets set YOOKASSA_SANDBOX_WORKER_TOKEN="$YOOKASSA_SANDBOX_WORKER_TOKEN" --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase functions deploy sandbox-checkout --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase functions deploy sandbox-reconcile --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase functions deploy sandbox-reconcile-order --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase functions deploy yookassa-sandbox-webhook --project-ref "$SUPABASE_PROJECT_ID"

      - name: Enable verified sandbox after publication
        if: inputs.operation == 'deploy' && inputs.deploy_sandbox
        run: npx supabase secrets set YOOKASSA_SANDBOX_ENABLED=true --project-ref "$SUPABASE_PROJECT_ID"

  reconcile:
    if: inputs.operation == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Reconcile test payments and refunds
        env:
          YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
        run: node scripts/run-stage-billing-worker.mjs

  reconcile-order:
    if: github.ref == 'refs/heads/staging' && inputs.operation == 'reconcile-order'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Reconcile exactly one sandbox order (no refunds)
        env:
          YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
          SANDBOX_ORDER_ID: ${{ inputs.sandbox_order_id }}
        run: node scripts/run-stage-billing-worker.mjs --order
  admin-migrate:
    if: inputs.operation == 'payments-release-dry-run' || inputs.operation == 'payments-release-deploy' || inputs.operation == 'tariff-release-dry-run' || inputs.operation == 'tariff-release-deploy' || inputs.operation == 'admin-dry-run' || inputs.operation == 'admin-deploy' || inputs.operation == 'admin-catalog-dry-run' || inputs.operation == 'admin-catalog-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate target and credentials
        run: |
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Check exact pending migration set
        env:
          ADMIN_OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$ADMIN_OPERATION" == payments-release-* ]]; then
            node scripts/check-admin-stage-migrations.mjs --payments-release
          elif [[ "$ADMIN_OPERATION" == tariff-release-* ]]; then
            node scripts/check-admin-stage-migrations.mjs --tariff-release
          elif [[ "$ADMIN_OPERATION" == admin-catalog-* ]]; then
            node scripts/check-admin-stage-migrations.mjs --catalog
          else
            node scripts/check-admin-stage-migrations.mjs
          fi
      - name: Preview admin migrations
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --dry-run
      - name: Apply only admin migrations
        if: inputs.operation == 'admin-deploy' || inputs.operation == 'admin-catalog-deploy' || inputs.operation == 'tariff-release-deploy' || inputs.operation == 'payments-release-deploy'
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes
      - name: Verify administrative RLS and RPC
        if: inputs.operation == 'admin-deploy'
        run: npx supabase test db --linked --project-ref "$SUPABASE_PROJECT_ID" supabase/tests/database/platform*.test.sql

      - name: Verify tariff catalog RLS without re-running owner bootstrap
        if: inputs.operation == 'admin-catalog-deploy'
        run: npx supabase test db --linked --project-ref "$SUPABASE_PROJECT_ID" supabase/tests/database/platform_tariff_catalog.test.sql

      - name: Verify tariff release RPC and permissions
        if: inputs.operation == 'tariff-release-deploy'
        run: npx supabase test db --linked --project-ref "$SUPABASE_PROJECT_ID" supabase/tests/database/billing_discount*.test.sql supabase/tests/database/billing_trial_full_price*.test.sql supabase/tests/database/billing_trial_timeline.test.sql supabase/tests/database/platform_tariff_support_end.test.sql supabase/tests/database/platform_tariff_source_version.test.sql

      - name: Verify campaign catalog and personal codes with scoped fixtures
        if: inputs.operation == 'tariff-release-deploy'
        run: npx supabase test db --linked --project-ref "$SUPABASE_PROJECT_ID" supabase/tests/database/platform_discount*.test.sql

      - name: Verify payment catalog and refund permissions
        if: inputs.operation == 'payments-release-deploy'
        run: npx supabase test db --linked --project-ref "$SUPABASE_PROJECT_ID" supabase/tests/database/platform_payment_catalog.test.sql supabase/tests/database/billing_refunded_duplicate.test.sql

  recurring-migrate:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'recurring-dry-run' || inputs.operation == 'recurring-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate operation and target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$OPERATION" = recurring-dry-run || test "$OPERATION" = recurring-apply
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Test migration history guard
        run: npm test -- scripts/check-admin-stage-migrations.test.js --maxWorkers=1
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Validate exact recurring migration set
        run: node scripts/check-admin-stage-migrations.mjs --recurring-release
      - name: Preview migrations
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --dry-run
      - name: Recheck history before applying
        if: inputs.operation == 'recurring-apply'
        run: node scripts/check-admin-stage-migrations.mjs --recurring-release
      - name: Apply recurring migrations
        if: inputs.operation == 'recurring-apply'
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes
      - name: Verify history after apply
        if: inputs.operation == 'recurring-apply'
        run: node scripts/check-admin-stage-migrations.mjs --recurring-release --require-applied
      - name: Record scope
        run: |
          echo "Recurring migration operation completed for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'No functions, schedules, frontend flags or recurring enablement changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"

  recurring-acceptance-run:
    if: github.ref == 'refs/heads/staging' && inputs.operation == 'recurring-acceptance-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
      ACCEPTANCE_ORGANIZATION_ID: ${{ inputs.recurring_organization_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test -- scripts/run-stage-recurring-worker.test.js scripts/verify-disabled-recurring.test.js --maxWorkers=1
      - name: Validate explicit scope and worker credential
        run: |
          node -e "if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.env.ACCEPTANCE_ORGANIZATION_ID ?? '') || !/^[a-f0-9]{64}$/.test(process.env.YOOKASSA_SANDBOX_WORKER_TOKEN ?? '')) process.exit(1)"
      - name: Disable before setting acceptance scope
        run: npx supabase secrets set YOOKASSA_SANDBOX_RECURRING_ENABLED=false --project-ref "$SUPABASE_PROJECT_ID"
      - name: Select only the acceptance organization
        run: npx supabase secrets set "YOOKASSA_SANDBOX_RECURRING_ORGANIZATION_ID=$ACCEPTANCE_ORGANIZATION_ID" --project-ref "$SUPABASE_PROJECT_ID"
      - name: Enable bounded acceptance
        run: npx supabase secrets set YOOKASSA_SANDBOX_RECURRING_ENABLED=true --project-ref "$SUPABASE_PROJECT_ID"
      - name: Run once without automatic retry
        run: node scripts/run-stage-recurring-worker.mjs
      - name: Always disable after acceptance
        if: always()
        run: npx supabase secrets set YOOKASSA_SANDBOX_RECURRING_ENABLED=false --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify disabled state
        if: always()
        run: node scripts/verify-disabled-recurring.mjs

  recurring-disabled-smoke:
    if: github.ref == 'refs/heads/staging' && inputs.operation == 'recurring-disabled-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test -- scripts/verify-disabled-recurring.test.js --maxWorkers=1
      - name: Disable recurring before authenticated smoke
        run: npx supabase secrets set YOOKASSA_SANDBOX_RECURRING_ENABLED=false --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify disabled endpoint without logging secrets
        run: node scripts/verify-disabled-recurring.mjs
  recurring-notice-migrate:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'recurring-notice-dry-run' || inputs.operation == 'recurring-notice-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate operation and target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$OPERATION" = recurring-notice-dry-run || test "$OPERATION" = recurring-notice-apply
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Test migration history guard
        run: npm test -- scripts/check-admin-stage-migrations.test.js --maxWorkers=1
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Validate exact recurring migration set
        run: node scripts/check-admin-stage-migrations.mjs --recurring-notice
      - name: Preview migrations
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --dry-run
      - name: Recheck history before applying
        if: inputs.operation == 'recurring-notice-apply'
        run: node scripts/check-admin-stage-migrations.mjs --recurring-notice
      - name: Apply recurring migrations
        if: inputs.operation == 'recurring-notice-apply'
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes
      - name: Verify history after apply
        if: inputs.operation == 'recurring-notice-apply'
        run: node scripts/check-admin-stage-migrations.mjs --recurring-notice --require-applied
      - name: Record scope
        run: |
          echo "Recurring migration operation completed for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'No functions, schedules, frontend flags or recurring enablement changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"

  recurring-scope-migrate:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'recurring-scope-dry-run' || inputs.operation == 'recurring-scope-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate operation and target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$OPERATION" = recurring-scope-dry-run || test "$OPERATION" = recurring-scope-apply
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Test migration history guard
        run: npm test -- scripts/check-admin-stage-migrations.test.js --maxWorkers=1
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Validate exact recurring migration set
        run: node scripts/check-admin-stage-migrations.mjs --recurring-scope
      - name: Preview migrations
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --dry-run
      - name: Recheck history before applying
        if: inputs.operation == 'recurring-scope-apply'
        run: node scripts/check-admin-stage-migrations.mjs --recurring-scope
      - name: Apply recurring migrations
        if: inputs.operation == 'recurring-scope-apply'
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes
      - name: Verify history after apply
        if: inputs.operation == 'recurring-scope-apply'
        run: node scripts/check-admin-stage-migrations.mjs --recurring-scope --require-applied
      - name: Record scope
        run: |
          echo "Recurring migration operation completed for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'No functions, schedules, frontend flags or recurring enablement changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"

  future-discount-migrate:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'future-discount-dry-run' || inputs.operation == 'future-discount-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate operation and target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$OPERATION" = future-discount-dry-run || test "$OPERATION" = future-discount-apply
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Test migration history guard
        run: npm test -- scripts/check-admin-stage-migrations.test.js --maxWorkers=1
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Validate exact recurring migration set
        run: node scripts/check-admin-stage-migrations.mjs --future-discount
      - name: Preview migrations
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --dry-run
      - name: Recheck history before applying
        if: inputs.operation == 'future-discount-apply'
        run: node scripts/check-admin-stage-migrations.mjs --future-discount
      - name: Apply recurring migrations
        if: inputs.operation == 'future-discount-apply'
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes
      - name: Verify history after apply
        if: inputs.operation == 'future-discount-apply'
        run: node scripts/check-admin-stage-migrations.mjs --future-discount --require-applied
      - name: Record scope
        run: |
          echo "Recurring migration operation completed for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'No functions, schedules, frontend flags or recurring enablement changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"

  recurring-consents-migrate:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'recurring-consents-dry-run' || inputs.operation == 'recurring-consents-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate operation and target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$OPERATION" = recurring-consents-dry-run || test "$OPERATION" = recurring-consents-apply
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Test migration history guard
        run: npm test -- scripts/check-admin-stage-migrations.test.js --maxWorkers=1
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Validate exact recurring migration set
        run: node scripts/check-admin-stage-migrations.mjs --recurring-consents
      - name: Preview migrations
        run: npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --dry-run

name: Reconcile sandbox billing staging

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      # Расписание закрыто до явного включения переменной в staging.
      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || vars.BILLING_SANDBOX_WORKER_SCHEDULE_ENABLED == 'true'
        uses: actions/checkout@v7
      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || vars.BILLING_SANDBOX_WORKER_SCHEDULE_ENABLED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Reconcile test payments and refunds
        if: github.event_name == 'workflow_dispatch' || vars.BILLING_SANDBOX_WORKER_SCHEDULE_ENABLED == 'true'
        env:
          YOOKASSA_SANDBOX_WORKER_TOKEN: ${{ secrets.YOOKASSA_SANDBOX_WORKER_TOKEN }}
        run: node scripts/run-stage-billing-worker.mjs

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-billing-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Verify candidate manifest
        run: node scripts/verify-production-candidate-manifest.js
      - name: Prepare isolated database images
        run: |
          docker pull supabase/postgres:17.6.1.165
          docker pull supabase/gotrue:v2.196.0
          docker pull supabase/storage-api:v1.70.3
      - name: Full historical schema and environment isolation
        env:
          QVESTA_TEST_PRODUCTION_BASELINE: '1'
        run: npm run test -- scripts/production-baseline-migrations.test.js

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Verify production billing candidate manifest
        run: node scripts/verify-production-candidate-manifest.js

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

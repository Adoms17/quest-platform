name: Stage receipt migrations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Receipt schema only; no functions or fiscal activation
        type: choice
        required: true
        default: receipts-dry-run
        options:
          - receipts-dry-run
          - receipts-apply

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  receipts-migrate:
    if: github.ref == 'refs/heads/staging' && (inputs.operation == 'receipts-dry-run' || inputs.operation == 'receipts-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jeugfyaqzfgdvfhdxfht
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate operation and target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$OPERATION" = receipts-dry-run || test "$OPERATION" = receipts-apply
          test "$SUPABASE_PROJECT_ID" = jeugfyaqzfgdvfhdxfht
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Test release guard
        run: npm test -- scripts/check-receipt-stage-release.test.js --maxWorkers=1
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Validate exact receipt migrations and checksums
        run: |
          npx supabase migration list --linked --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/receipt-migrations.json"
          node scripts/check-receipt-stage-release.mjs "$RUNNER_TEMP/receipt-migrations.json"
      - name: Preview migrations
        run: |
          npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --include-all --dry-run > "$RUNNER_TEMP/receipt-preview.txt" 2>&1
          node scripts/check-receipt-stage-release.mjs "$RUNNER_TEMP/receipt-migrations.json" --preview "$RUNNER_TEMP/receipt-preview.txt"
      - name: Recheck history and apply receipt migrations
        if: inputs.operation == 'receipts-apply'
        run: |
          npx supabase migration list --linked --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/receipt-migrations.json"
          node scripts/check-receipt-stage-release.mjs "$RUNNER_TEMP/receipt-migrations.json"
          npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --include-all --dry-run > "$RUNNER_TEMP/receipt-preview.txt" 2>&1
          node scripts/check-receipt-stage-release.mjs "$RUNNER_TEMP/receipt-migrations.json" --preview "$RUNNER_TEMP/receipt-preview.txt"
          npx supabase db push --linked --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --include-all --yes
      - name: Verify history after apply
        if: inputs.operation == 'receipts-apply'
        run: |
          npx supabase migration list --linked --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/receipt-migrations.json"
          node scripts/check-receipt-stage-release.mjs "$RUNNER_TEMP/receipt-migrations.json" --require-applied
